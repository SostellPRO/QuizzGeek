<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>QuizzGeek</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Exo+2:wght@700;800;900&display=swap" rel="stylesheet">

  <!-- Tailwind CSS Play CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            bg:     { DEFAULT: '#0d0d1a', alt: '#14142a', card: '#1a1a2e', input: '#1f1f38' },
            accent: { DEFAULT: '#b24bff', dark: '#8b2ede', glow: 'rgba(178,75,255,0.35)' },
            neon:   { green: '#38ef7d', blue: '#4facfe', orange: '#f7971e', red: '#ff4e6a' },
            muted:  'rgba(255,255,255,0.45)',
          },
          fontFamily: {
            sans:    ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
            display: ['"Exo 2"', 'Inter', 'sans-serif'],
          },
          animation: {
            'pulse-soft': 'pulse 2s cubic-bezier(0.4,0,0.6,1) infinite',
            'bounce-in':  'bounceIn 0.5s ease-out',
            'fade-in':    'fadeIn 0.3s ease-out',
            'float':      'float 3s ease-in-out infinite',
          },
          keyframes: {
            bounceIn:  { '0%':{ transform:'scale(0.8)',opacity:'0' }, '60%':{ transform:'scale(1.05)' }, '100%':{ transform:'scale(1)',opacity:'1' } },
            fadeIn:    { '0%':{ opacity:'0', transform:'translateY(8px)' }, '100%':{ opacity:'1', transform:'translateY(0)' } },
            float:     { '0%,100%':{ transform:'translateY(0)' }, '50%':{ transform:'translateY(-8px)' } },
            dots:      { '0%,80%,100%':{ transform:'scale(0)' }, '40%':{ transform:'scale(1)' } },
          },
          boxShadow: {
            'accent':     '0 0 24px rgba(178,75,255,0.4)',
            'neon-green': '0 0 16px rgba(56,239,125,0.4)',
            'neon-blue':  '0 0 16px rgba(79,172,254,0.4)',
          },
        }
      }
    }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: #0d0d1a;
      color: rgba(255,255,255,0.92);
      font-family: 'Inter', sans-serif;
      min-height: 100dvh;
      overflow-x: hidden;
    }
    #root { min-height: 100dvh; display: flex; flex-direction: column; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0d0d1a; }
    ::-webkit-scrollbar-thumb { background: #3d1a70; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #6b21cc; }

    /* Focus */
    :focus-visible { outline: 2px solid #b24bff; outline-offset: 2px; border-radius: 6px; }

    /* Waiting dots animation */
    .dot-bounce { display: inline-flex; gap: 6px; align-items: center; }
    .dot-bounce span {
      width: 8px; height: 8px; border-radius: 50%;
      background: rgba(178,75,255,0.7);
      animation: dotBounce 1.4s ease-in-out infinite;
    }
    .dot-bounce span:nth-child(1) { animation-delay: 0s; }
    .dot-bounce span:nth-child(2) { animation-delay: 0.2s; }
    .dot-bounce span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes dotBounce {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40% { transform: scale(1); opacity: 1; }
    }

    /* Pulse ring */
    @keyframes ring {
      0% { box-shadow: 0 0 0 0 rgba(178,75,255,0.5); }
      70% { box-shadow: 0 0 0 12px rgba(178,75,255,0); }
      100% { box-shadow: 0 0 0 0 rgba(178,75,255,0); }
    }
    .ring-pulse { animation: ring 1.8s ease-out infinite; }
    @keyframes ringGreen {
      0% { box-shadow: 0 0 0 0 rgba(56,239,125,0.5); }
      70% { box-shadow: 0 0 0 12px rgba(56,239,125,0); }
      100% { box-shadow: 0 0 0 0 rgba(56,239,125,0); }
    }
    .ring-pulse-green { animation: ringGreen 1.8s ease-out infinite; }

    /* Neon glow gradient text */
    .gradient-text {
      background: linear-gradient(135deg, #b24bff 0%, #4facfe 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .gradient-text-green {
      background: linear-gradient(135deg, #38ef7d 0%, #4facfe 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .gradient-text-fire {
      background: linear-gradient(135deg, #f7971e 0%, #ff4e6a 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Music mute btn */
    .music-mute-btn {
      position: fixed; bottom: 16px; right: 16px; z-index: 999;
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(20,20,42,0.9); border: 1px solid rgba(178,75,255,0.4);
      color: white; font-size: 1rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s;
    }
    .music-mute-btn:hover { border-color: #b24bff; background: rgba(178,75,255,0.2); }

    /* Full-screen display */
    .display-fullscreen { width: 100vw; min-height: 100dvh; position: relative; overflow: hidden; }

    /* Background overlay */
    .bg-overlay { position: absolute; inset: 0; background: rgba(10,10,25,0.65); pointer-events: none; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "react":             "https://esm.sh/react@18.3.1",
      "react-dom":         "https://esm.sh/react-dom@18.3.1",
      "react-dom/client":  "https://esm.sh/react-dom@18.3.1/client",
      "htm":               "https://esm.sh/htm@3.1.1"
    }
  }
  </script>
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
