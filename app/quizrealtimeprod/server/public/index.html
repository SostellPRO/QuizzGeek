<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>QuizzGeek</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee+Inline&family=Inter:wght@400;500;600;700;800;900&family=Exo+2:wght@700;800;900&display=swap" rel="stylesheet">

  <!-- Tailwind CSS Play CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            bg:     { DEFAULT: '#080a12', alt: '#101423', card: '#151a2b', input: '#111827' },
            accent: { DEFAULT: '#7c5cff', dark: '#5b46d6', glow: 'rgba(124,92,255,0.32)' },
            neon:   { green: '#2dd4bf', blue: '#38bdf8', orange: '#f59e0b', red: '#fb7185' },
            muted:  'rgba(255,255,255,0.45)',
          },
          fontFamily: {
            sans:    ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
            display: ['"Exo 2"', 'Inter', 'sans-serif'],
          },
          animation: {
            'pulse-soft': 'pulse 2s cubic-bezier(0.4,0,0.6,1) infinite',
            'bounce-in':  'bounceIn 0.5s ease-out',
            'fade-in':    'fadeIn 0.3s ease-out',
            'float':      'float 3s ease-in-out infinite',
          },
          keyframes: {
            bounceIn:  { '0%':{ transform:'scale(0.8)',opacity:'0' }, '60%':{ transform:'scale(1.05)' }, '100%':{ transform:'scale(1)',opacity:'1' } },
            fadeIn:    { '0%':{ opacity:'0', transform:'translateY(8px)' }, '100%':{ opacity:'1', transform:'translateY(0)' } },
            float:     { '0%,100%':{ transform:'translateY(0)' }, '50%':{ transform:'translateY(-8px)' } },
            dots:      { '0%,80%,100%':{ transform:'scale(0)' }, '40%':{ transform:'scale(1)' } },
          },
          boxShadow: {
            'accent':     '0 16px 46px rgba(124,92,255,0.28)',
            'surface':    '0 18px 60px rgba(0,0,0,0.34)',
            'neon-green': '0 0 18px rgba(45,212,191,0.34)',
            'neon-blue':  '0 0 18px rgba(56,189,248,0.34)',
          },
        }
      }
    }
  </script>
  <style>
    :root {
      --c-bg: #080a12;
      --c-panel: rgba(13, 18, 34, 0.78);
      --c-panel-strong: rgba(17, 24, 39, 0.9);
      --c-line: rgba(255,255,255,0.12);
      --c-primary: #7c5cff;
      --c-sky: #38bdf8;
      --c-teal: #2dd4bf;
      --c-amber: #f59e0b;
      --c-rose: #fb7185;
      --ease-out: cubic-bezier(.22, 1, .36, 1);
      --ease-spring: cubic-bezier(.2, 1.25, .28, 1);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background:
        radial-gradient(circle at 50% -20%, rgba(56,189,248,0.12), transparent 38%),
        linear-gradient(145deg, #080a12 0%, #0c1020 48%, #080a12 100%);
      color: rgba(255,255,255,0.92);
      font-family: 'Inter', sans-serif;
      min-height: 100dvh;
      overflow-x: hidden;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: linear-gradient(to bottom, rgba(0,0,0,0.95), rgba(0,0,0,0.25));
    }
    #root { min-height: 100dvh; display: flex; flex-direction: column; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0d0d1a; }
    ::-webkit-scrollbar-thumb { background: rgba(124,92,255,0.45); border-radius: 999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(45,212,191,0.58); }

    /* Focus */
    :focus-visible { outline: 2px solid var(--c-sky); outline-offset: 3px; border-radius: 8px; }

    button, a, input, textarea, select {
      -webkit-tap-highlight-color: transparent;
    }
    button, a {
      touch-action: manipulation;
    }

    input, textarea, select {
      color-scheme: dark;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
      transition: border-color .22s var(--ease-out), box-shadow .22s var(--ease-out), background .22s var(--ease-out);
    }
    input::placeholder, textarea::placeholder { color: rgba(255,255,255,0.28); }
    input:focus, textarea:focus, select:focus {
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.05), 0 0 0 3px rgba(56,189,248,0.12);
    }

    .app-surface {
      background:
        linear-gradient(180deg, rgba(255,255,255,0.085), rgba(255,255,255,0.035)),
        linear-gradient(135deg, rgba(56,189,248,0.045), rgba(124,92,255,0.035));
      border: 1px solid var(--c-line);
      box-shadow: 0 20px 70px rgba(0,0,0,0.36), inset 0 1px 0 rgba(255,255,255,0.09);
      backdrop-filter: blur(20px) saturate(1.2);
      transition: transform .28s var(--ease-out), border-color .28s var(--ease-out), box-shadow .28s var(--ease-out), background .28s var(--ease-out);
    }
    .app-panel {
      background: var(--c-panel);
      border: 1px solid rgba(255,255,255,0.09);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.06);
      backdrop-filter: blur(14px);
    }
    .app-chip {
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.10);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.06);
      transition: transform .22s var(--ease-spring), border-color .22s var(--ease-out), background .22s var(--ease-out), color .22s var(--ease-out);
    }
    .app-chip:hover { transform: translateY(-1px); border-color: rgba(56,189,248,0.38); background: rgba(255,255,255,0.1); }

    .lang-switch input {
      position: absolute;
      inset: 0;
      z-index: 20;
      width: 100%;
      opacity: 0;
      cursor: pointer;
    }
    .lang-switch-thumb {
      position: absolute;
      top: 4px;
      bottom: 4px;
      width: calc(50% - 4px);
      border-radius: 999px;
      background: linear-gradient(135deg, rgba(56,189,248,.9), rgba(124,92,255,.9));
      box-shadow: 0 10px 28px rgba(56,189,248,.22), inset 0 1px 0 rgba(255,255,255,.28);
      transition: transform .28s var(--ease-spring);
    }
    .lang-switch-thumb.left { transform: translateX(0); }
    .lang-switch-thumb.right { transform: translateX(calc(100% + 0px)); }
    /* ── Language slider ───────────────────────────────────────── */
    .nav-lang-switch {
      position: relative;
      display: inline-flex;
      align-items: center;
      width: 68px;
      height: 30px;
      flex: 0 0 auto;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 10px;
      cursor: pointer;
      background: rgba(255,255,255,.06);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.1), 0 3px 10px rgba(0,0,0,.2);
      transition: filter .18s ease, border-color .18s ease;
    }
    .nav-lang-switch:hover  { filter: brightness(1.12); border-color: rgba(125,211,252,.35); }
    .nav-lang-switch:active { filter: brightness(.92); }

    /* Chaque face (drapeau) = même taille que le knob, coins arrondis */
    .nav-lang-face {
      position: absolute;
      top: 3px;
      width: 28px;
      height: 24px;
      border-radius: 7px;
      overflow: hidden;
      opacity: 0;
      transition: opacity .22s ease;
    }
    /* Drapeau FR — côté GAUCHE (visible en mode FR, knob à droite) */
    .nav-lang-fr {
      left: 3px;
      background: linear-gradient(90deg,
        #002395 0 33.3%,
        #fff    33.3% 66.6%,
        #ED2939 66.6% 100%
      );
    }
    /* Union Jack — côté DROIT (visible en mode EN, knob à gauche) */
    .nav-lang-en {
      right: 3px;
      background:
        /* Croix rouge (St George) */
        linear-gradient(90deg, transparent 40%, #C8102E 40%, #C8102E 60%, transparent 60%),
        linear-gradient(0deg,  transparent 38%, #C8102E 38%, #C8102E 62%, transparent 62%),
        /* Croix blanche (St George épaisse) */
        linear-gradient(90deg, transparent 34%, #fff 34%, #fff 66%, transparent 66%),
        linear-gradient(0deg,  transparent 32%, #fff 32%, #fff 68%, transparent 68%),
        /* Diagonales blanches (St Andrew) */
        linear-gradient(45deg,  transparent 42%, #fff 42%, #fff 58%, transparent 58%),
        linear-gradient(-45deg, transparent 42%, #fff 42%, #fff 58%, transparent 58%),
        /* Fond bleu */
        #012169;
    }
    .nav-lang-switch.is-fr .nav-lang-fr { opacity: 1; }
    .nav-lang-switch.is-en .nav-lang-en { opacity: 1; }

    /* Knob gris clair — même taille que les drapeaux, coins arrondis */
    /* Par défaut à DROITE (mode FR) */
    .nav-lang-knob {
      position: absolute;
      top: 3px;
      left: 3px;
      z-index: 2;
      width: 28px;
      height: 24px;
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, rgba(255,255,255,.97), rgba(215,225,238,.92));
      color: #0b1020;
      font-size: 9.5px;
      font-weight: 900;
      letter-spacing: .06em;
      box-shadow: 0 2px 8px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.85);
      transform: translateX(34px);   /* 68 - 28 - 3 - 3 = 34 */
      transition: transform .28s cubic-bezier(.34,1.56,.64,1);
      user-select: none;
    }
    /* Mode EN : knob se déplace à GAUCHE */
    .nav-lang-switch.is-en .nav-lang-knob {
      transform: translateX(0);
    }
    .theme-menu {
      box-shadow:
        0 22px 56px rgba(0,0,0,.38),
        inset 0 1px 0 rgba(255,255,255,.08);
      animation: menuDrop .18s var(--ease-out);
    }
    .theme-menu-item {
      justify-content: flex-start;
      border: 1px solid transparent;
    }
    .theme-menu-item.is-active {
      border-color: rgba(56,189,248,.28);
      background: rgba(56,189,248,.13);
    }
    @keyframes menuDrop {
      from { opacity: 0; transform: translateY(-6px) scale(.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .ui-btn {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      transform: translateZ(0);
      transition:
        transform .2s var(--ease-spring),
        filter .2s var(--ease-out),
        box-shadow .24s var(--ease-out),
        border-color .24s var(--ease-out),
        background .24s var(--ease-out);
    }
    .ui-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      z-index: -1;
      opacity: 0;
      background: linear-gradient(120deg, transparent 0%, rgba(255,255,255,0.26) 45%, transparent 72%);
      transform: translateX(-130%);
      transition: transform .55s var(--ease-out), opacity .25s var(--ease-out);
    }
    .ui-btn::after {
      content: '';
      position: absolute;
      inset: 1px;
      z-index: -2;
      border-radius: inherit;
      background: rgba(255,255,255,0.04);
      pointer-events: none;
    }
    .ui-btn:hover:not(:disabled) {
      transform: translateY(-2px) scale(1.01);
      filter: saturate(1.08) brightness(1.06);
    }
    .ui-btn:hover:not(:disabled)::before { opacity: 1; transform: translateX(130%); }
    .ui-btn:active:not(:disabled) { transform: translateY(1px) scale(.975); }
    .ui-btn:disabled { filter: grayscale(.18); }
    .ui-btn-primary { background: linear-gradient(135deg, #7c5cff 0%, #38bdf8 100%); }
    .ui-btn-success { background: linear-gradient(135deg, #2dd4bf 0%, #8bffca 100%); box-shadow: 0 14px 34px rgba(45,212,191,.22); }
    .ui-btn-danger { background: linear-gradient(135deg, #fb7185 0%, #ef4444 100%); box-shadow: 0 14px 34px rgba(251,113,133,.22); }
    .ui-btn-warning { background: linear-gradient(135deg, #fbbf24 0%, #f97316 100%); box-shadow: 0 14px 34px rgba(245,158,11,.22); }
    .ui-btn-secondary { background: linear-gradient(180deg, rgba(255,255,255,.1), rgba(255,255,255,.045)); backdrop-filter: blur(14px); }
    .ui-btn-ghost { background: rgba(255,255,255,.045); backdrop-filter: blur(12px); }
    .ui-btn-tv { background: linear-gradient(135deg, #67e8f9 0%, #38bdf8 48%, #2dd4bf 100%); box-shadow: 0 14px 34px rgba(56,189,248,.22); }
    .ui-btn-nav { background: linear-gradient(180deg, rgba(56,189,248,.11), rgba(124,92,255,.065)); backdrop-filter: blur(14px); }

    body[data-theme="business"] {
      background:
        radial-gradient(circle at 50% -20%, rgba(56,189,248,0.10), transparent 38%),
        linear-gradient(145deg, #07101d 0%, #0d1424 52%, #070b13 100%);
    }
    body[data-theme="business"] .app-surface {
      background:
        linear-gradient(180deg, rgba(255,255,255,0.075), rgba(255,255,255,0.032)),
        linear-gradient(135deg, rgba(56,189,248,0.05), rgba(15,23,42,0.2));
      border-color: rgba(148,163,184,0.18);
    }
    body[data-theme="business"] .gradient-text {
      background: linear-gradient(135deg, #f8fafc 0%, #67e8f9 48%, #60a5fa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    body[data-theme="party"] {
      background:
        radial-gradient(circle at 15% 10%, rgba(251,113,133,.22), transparent 28%),
        radial-gradient(circle at 85% 0%, rgba(45,212,191,.2), transparent 30%),
        radial-gradient(circle at 50% 110%, rgba(245,158,11,.18), transparent 35%),
        linear-gradient(145deg, #12081f 0%, #111827 45%, #21091b 100%);
    }
    body[data-theme="party"] .app-surface {
      background:
        linear-gradient(180deg, rgba(255,255,255,0.10), rgba(255,255,255,0.04)),
        linear-gradient(135deg, rgba(251,113,133,0.09), rgba(45,212,191,0.07));
      border-color: rgba(255,255,255,0.16);
      box-shadow: 0 22px 80px rgba(251,113,133,0.12), 0 18px 60px rgba(0,0,0,0.32), inset 0 1px 0 rgba(255,255,255,0.12);
    }
    body[data-theme="party"] .ui-btn-primary {
      background: linear-gradient(135deg, #fb7185 0%, #f59e0b 48%, #38bdf8 100%);
    }
    body[data-theme="party"] .gradient-text {
      background: linear-gradient(135deg, #fff7ed 0%, #fb7185 32%, #f59e0b 62%, #2dd4bf 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    body[data-theme="tvshow"] {
      background:
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px),
        radial-gradient(circle at 50% 10%, rgba(245,158,11,.18), transparent 28%),
        linear-gradient(145deg, #10051d 0%, #180b2d 42%, #070712 100%);
      background-size: 18px 18px, auto, auto;
    }
    body[data-theme="tvshow"] .font-display,
    body[data-theme="tvshow"] h1,
    body[data-theme="tvshow"] h2 {
      font-family: 'Bungee Inline', 'Exo 2', Inter, sans-serif;
      letter-spacing: 0.02em;
    }
    body[data-theme="tvshow"] .app-surface {
      background:
        linear-gradient(180deg, rgba(255,255,255,0.11), rgba(255,255,255,0.035)),
        linear-gradient(135deg, rgba(245,158,11,0.12), rgba(124,92,255,0.12));
      border-color: rgba(245,158,11,0.26);
      box-shadow: 0 0 0 1px rgba(245,158,11,.12), 0 22px 80px rgba(124,92,255,.16), inset 0 1px 0 rgba(255,255,255,.16);
    }
    body[data-theme="tvshow"] .ui-btn-primary,
    body[data-theme="tvshow"] .ui-btn-nav {
      background: linear-gradient(135deg, #f59e0b 0%, #fb7185 48%, #7c5cff 100%);
    }
    body[data-theme="tvshow"] .gradient-text {
      background: linear-gradient(135deg, #fde68a 0%, #fb7185 48%, #38bdf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .mobile-choice,
    .choice-card {
      position: relative;
      overflow: hidden;
      transform: translateZ(0);
      transition: transform .22s var(--ease-spring), border-color .22s var(--ease-out), filter .22s var(--ease-out), box-shadow .22s var(--ease-out);
      will-change: transform;
    }
    .mobile-choice::before,
    .choice-card::before {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at 20% 0%, rgba(255,255,255,.18), transparent 34%);
      opacity: .45;
    }
    .mobile-choice:active,
    .choice-card:active {
      transform: scale(.975);
      filter: brightness(1.12);
    }
    .mobile-choice:disabled { transform: none; filter: grayscale(.25); }
    .tap-feedback { animation: tapPop .32s var(--ease-spring); }

    /* Waiting dots animation */
    .dot-bounce { display: inline-flex; gap: 6px; align-items: center; }
    .dot-bounce span {
      width: 8px; height: 8px; border-radius: 50%;
      background: rgba(56,189,248,0.86);
      animation: dotBounce 1.4s ease-in-out infinite;
    }
    .dot-bounce span:nth-child(1) { animation-delay: 0s; }
    .dot-bounce span:nth-child(2) { animation-delay: 0.2s; }
    .dot-bounce span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes dotBounce {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40% { transform: scale(1); opacity: 1; }
    }
    @keyframes tapPop {
      0% { transform: scale(.96); }
      62% { transform: scale(1.025); }
      100% { transform: scale(1); }
    }
    @keyframes softSlideUp {
      from { opacity: 0; transform: translateY(14px) scale(.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .animate-soft-slide-up { animation: softSlideUp .42s var(--ease-out) both; }

    /* Pulse ring */
    @keyframes ring {
      0% { box-shadow: 0 0 0 0 rgba(56,189,248,0.42); }
      70% { box-shadow: 0 0 0 12px rgba(56,189,248,0); }
      100% { box-shadow: 0 0 0 0 rgba(56,189,248,0); }
    }
    .ring-pulse { animation: ring 1.8s ease-out infinite; }
    .ui-btn.is-next-action {
      border-color: rgba(56,189,248,0.86) !important;
      color: white;
      transform: translateY(-1px);
      box-shadow:
        0 0 0 1px rgba(56,189,248,0.45),
        0 0 0 7px rgba(56,189,248,0.09),
        0 16px 42px rgba(56,189,248,0.25),
        inset 0 1px 0 rgba(255,255,255,0.24);
      animation: nextActionPulse 1.25s var(--ease-out) infinite;
    }
    .ui-btn.is-next-action::after {
      background:
        linear-gradient(135deg, rgba(255,255,255,0.16), rgba(255,255,255,0.035)),
        radial-gradient(circle at 50% 0%, rgba(56,189,248,0.24), transparent 55%);
    }
    @keyframes nextActionPulse {
      0%, 100% {
        box-shadow:
          0 0 0 1px rgba(56,189,248,0.45),
          0 0 0 6px rgba(56,189,248,0.08),
          0 16px 42px rgba(56,189,248,0.22),
          inset 0 1px 0 rgba(255,255,255,0.24);
      }
      50% {
        box-shadow:
          0 0 0 1px rgba(45,212,191,0.7),
          0 0 0 12px rgba(45,212,191,0.12),
          0 22px 58px rgba(45,212,191,0.3),
          inset 0 1px 0 rgba(255,255,255,0.3);
      }
    }
    @keyframes ringGreen {
      0% { box-shadow: 0 0 0 0 rgba(56,239,125,0.5); }
      70% { box-shadow: 0 0 0 12px rgba(56,239,125,0); }
      100% { box-shadow: 0 0 0 0 rgba(56,239,125,0); }
    }
    .ring-pulse-green { animation: ringGreen 1.8s ease-out infinite; }

    /* Neon glow gradient text */
    .gradient-text {
      background: linear-gradient(135deg, #f8fafc 0%, #38bdf8 48%, #7c5cff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .gradient-text-green {
      background: linear-gradient(135deg, #2dd4bf 0%, #38bdf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .gradient-text-fire {
      background: linear-gradient(135deg, #f59e0b 0%, #fb7185 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Music mute btn */
    .music-mute-btn {
      position: fixed; bottom: 16px; right: 16px; z-index: 999;
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(20,20,42,0.9); border: 1px solid rgba(178,75,255,0.4);
      color: white; font-size: 1rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s;
    }
    .music-mute-btn:hover { border-color: var(--c-sky); background: rgba(56,189,248,0.18); transform: translateY(-1px) scale(1.04); }
    .music-mute-btn:active { transform: scale(.96); }

    .join-code-badge {
      position: fixed;
      top: max(12px, env(safe-area-inset-top));
      left: max(12px, env(safe-area-inset-left));
      z-index: 80;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-height: 44px;
      padding: 8px 12px;
      border-radius: 14px;
      background:
        linear-gradient(180deg, rgba(8,12,24,.88), rgba(8,12,24,.68)),
        radial-gradient(circle at 0% 0%, rgba(56,189,248,.24), transparent 55%);
      border: 1px solid rgba(56,189,248,.34);
      box-shadow: 0 18px 50px rgba(0,0,0,.34), 0 0 0 1px rgba(255,255,255,.06);
      backdrop-filter: blur(16px);
      pointer-events: none;
    }
    .join-code-badge .label {
      font-size: 10px;
      line-height: 1;
      font-weight: 900;
      text-transform: uppercase;
      color: rgba(255,255,255,.48);
      letter-spacing: .16em;
    }
    .join-code-badge .code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: clamp(1.2rem, 2.8vw, 1.9rem);
      line-height: 1;
      font-weight: 950;
      color: #7dd3fc;
      letter-spacing: .16em;
    }

    /* Full-screen display */
    .display-fullscreen { width: 100vw; min-height: 100dvh; position: relative; overflow: hidden; }

    /* Background overlay */
    .bg-overlay { position: absolute; inset: 0; background: rgba(10,10,25,0.65); pointer-events: none; }

    @media (max-width: 640px) {
      body::before { background-size: 34px 34px; }
      .app-surface { box-shadow: 0 14px 44px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.08); }
      .ui-btn { min-height: 48px; }
      .mobile-choice { min-height: 64px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }

    .game-icon-mono {
      filter: drop-shadow(0 2px 8px rgba(0,0,0,.22));
    }

    /* ── Round Intro Animations ──────────────────────────────── */

    /* Ambient glow pulse */
    @keyframes ri-glow-pulse {
      0%, 100% { opacity: 0.55; transform: scale(1); }
      50%       { opacity: 0.85; transform: scale(1.06); }
    }

    /* Main icon: spring bounce-in then gentle float */
    @keyframes ri-icon-reveal {
      0%   { transform: scale(0.2) rotate(-18deg); opacity: 0; filter: blur(12px); }
      55%  { transform: scale(1.14) rotate(5deg);  opacity: 1; filter: blur(0); }
      75%  { transform: scale(0.94) rotate(-2deg); }
      100% { transform: scale(1)    rotate(0deg);  }
    }
    @keyframes ri-icon-float {
      0%, 100% { transform: translateY(0)    scale(1); }
      50%       { transform: translateY(-14px) scale(1.04); }
    }
    .ri-main-icon {
      animation:
        ri-icon-reveal 0.72s cubic-bezier(0.34, 1.56, 0.64, 1) both,
        ri-icon-float  3.4s ease-in-out 0.72s infinite;
      filter: drop-shadow(0 8px 32px color-mix(in srgb, var(--glow, #7c5cff) 50%, transparent));
    }

    /* Badge slides down */
    @keyframes ri-badge-in {
      from { transform: translateY(-24px); opacity: 0; }
      to   { transform: translateY(0);     opacity: 1; }
    }
    .ri-badge {
      animation: ri-badge-in 0.45s cubic-bezier(0.34, 1.4, 0.64, 1) 0.1s both;
    }
    /* Icon in badge spins once */
    @keyframes ri-badge-icon-spin {
      from { transform: rotate(-30deg) scale(0.6); opacity: 0; }
      to   { transform: rotate(0deg)   scale(1);   opacity: 1; }
    }
    .ri-badge-icon {
      animation: ri-badge-icon-spin 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.2s both;
    }

    /* Title slides up */
    @keyframes ri-title-up {
      from { transform: translateY(20px); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }
    .ri-title {
      animation: ri-title-up 0.5s cubic-bezier(0.34, 1.4, 0.64, 1) 0.55s both;
    }

    /* Rules fades in */
    .ri-rules {
      animation: ri-title-up 0.5s ease-out 0.75s both;
    }

    /* Decorative rings */
    .ri-ring {
      border-radius: 50%;
      border: 1.5px solid;
      pointer-events: none;
    }
    @keyframes ri-ring-expand {
      0%   { transform: translate(-50%, -50%) scale(0.3); opacity: 0.7; }
      100% { transform: translate(-50%, -50%) scale(1.8); opacity: 0; }
    }
    .ri-ring-1 {
      width: clamp(260px, 40vw, 480px);
      height: clamp(260px, 40vw, 480px);
      top: 40%; left: 50%;
      animation: ri-ring-expand 2.8s ease-out 0.1s infinite;
    }
    .ri-ring-2 {
      width: clamp(340px, 55vw, 640px);
      height: clamp(340px, 55vw, 640px);
      top: 40%; left: 50%;
      animation: ri-ring-expand 2.8s ease-out 0.9s infinite;
    }
